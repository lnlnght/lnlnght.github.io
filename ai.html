<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 인사이트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f5f8; color: #1a1a2e; min-height: 100vh; }

    /* ── Header ── */
    header { max-width: 1400px; margin: 0 auto; padding: 28px 20px 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .header-left h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #1a1a2e 0%, #5050a0 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .header-left p { font-size: 11px; color: #aaa; margin-top: 3px; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .update-label { font-size: 11px; color: #aaa; }
    .nav-link { padding: 5px 12px; border-radius: 8px; border: 1px solid #ddd; color: #888; font-size: 12px; text-decoration: none; transition: all 0.15s; white-space: nowrap; }
    .nav-link:hover { color: #333; border-color: #bbb; }
    .refresh-btn { padding: 5px 12px; border-radius: 8px; border: 1px solid #ddd; background: transparent; color: #888; font-size: 12px; cursor: pointer; transition: all 0.15s; }
    .refresh-btn:hover { color: #333; border-color: #bbb; }
    .refresh-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Person Tabs ── */
    .person-tabs { max-width: 1400px; margin: 0 auto; padding: 12px 20px 0; display: flex; gap: 8px; flex-wrap: wrap; }
    .person-tab { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 10px; border: 1px solid #ddd; background: transparent; color: #888; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .person-tab:hover { color: #333; border-color: #bbb; }
    .person-tab.active { background: #fff; color: #1a1a2e; border-color: var(--tab-color); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .tab-info { display: flex; flex-direction: column; line-height: 1.3; }
    .tab-name { font-size: 12px; font-weight: 600; }
    .tab-title { font-size: 10px; color: #bbb; }
    .person-tab.active .tab-title { color: #999; }

    /* ── Type Filter ── */
    .type-filter { max-width: 1400px; margin: 0 auto; padding: 14px 20px 0; display: flex; gap: 6px; align-items: center; }
    .type-btn { padding: 4px 14px; border-radius: 20px; border: 1px solid #ddd; background: transparent; color: #888; font-size: 12px; cursor: pointer; transition: all 0.15s; }
    .type-btn:hover { color: #333; border-color: #bbb; }
    .type-btn.active { background: #eeeef8; color: #1a1a2e; border-color: #6366f1; }

    /* ── Grid ── */
    .grid-wrap { max-width: 1400px; margin: 0 auto; padding: 20px 20px 60px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

    /* ── Card ── */
    .card { border-radius: 12px; border: 1px solid #e8e8f0; background: #fff; overflow: hidden; transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s; cursor: pointer; text-decoration: none; display: block; }
    .card:hover { border-color: #ccc; transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.07); }
    .card-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #f0f0f5; display: block; }
    .card-thumb-placeholder { width: 100%; aspect-ratio: 16/9; background: #f0f0f5; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 24px; }
    .card-body { padding: 12px 14px 14px; }
    .card-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
    .card-type { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px; }
    .type-video { background: #fff1f1; color: #dc2626; }
    .type-news  { background: #eff8ff; color: #0369a1; }
    .card-source { font-size: 10px; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-date { font-size: 10px; color: #ccc; margin-left: auto; flex-shrink: 0; }
    .card-title { font-size: 13px; color: #333; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* ── Briefing ── */
    .briefing-wrap { max-width: 1400px; margin: 0 auto; padding: 20px 20px 0; }
    .briefing-box { background: #fff; border: 1px solid #e8e8f0; border-radius: 14px; padding: 20px 24px; }
    .briefing-header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .briefing-header h2 { font-size: 14px; font-weight: 700; color: #1a1a2e; }
    .briefing-date { font-size: 11px; color: #bbb; margin-left: auto; }
    .briefing-list { display: flex; flex-direction: column; gap: 0; }
    .briefing-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f0f5; text-decoration: none; color: inherit; transition: background 0.1s; border-radius: 6px; }
    .briefing-item:last-child { border-bottom: none; }
    .briefing-item:hover { background: #fafafa; }
    .briefing-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
    .briefing-content { flex: 1; min-width: 0; }
    .briefing-person { font-size: 10px; font-weight: 600; margin-bottom: 2px; }
    .briefing-title { font-size: 13px; color: #333; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .briefing-summary { font-size: 12px; color: #555; line-height: 1.5; margin-top: 3px; }
    .briefing-source { font-size: 10px; color: #bbb; margin-top: 2px; }

    /* ── State ── */
    .state-msg { text-align: center; padding: 80px 20px; color: #bbb; font-size: 14px; line-height: 2; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .person-tab .tab-title { display: none; }
      .person-tab { padding: 6px 12px; }
      .briefing-title { -webkit-line-clamp: 2; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>AI 인사이트</h1>
    <p id="updated-label">업데이트: —</p>
  </div>
  <div class="header-right">
    <span class="update-label" id="last-update"></span>
    <a class="nav-link" href="/">홈</a>
    <a class="nav-link" href="/etf.html">ETF</a>
    <a class="nav-link" href="/stocks.html">주식</a>
    <button class="refresh-btn" id="refresh-btn" onclick="loadData(true)">↻ 새로고침</button>
  </div>
</header>

<div class="briefing-wrap">
  <div class="briefing-box">
    <div class="briefing-header">
      <span style="font-size:16px">📰</span>
      <h2>오늘의 AI 브리핑</h2>
      <span class="briefing-date" id="briefing-date"></span>
    </div>
    <div class="briefing-list" id="briefing-list">
      <div style="color:#bbb;font-size:13px;padding:12px 0">로딩 중...</div>
    </div>
  </div>
</div>

<div class="person-tabs" id="person-tabs"></div>
<div class="type-filter">
  <button class="type-btn active" data-type="all" onclick="setType('all')">&#xC804;&#xCCB4;</button>
  <button class="type-btn" data-type="video" onclick="setType('video')">&#x25B6; &#xC601;&#xC0C1;</button>
  <button class="type-btn" data-type="news" onclick="setType('news')">&#x1F4F0; &#xB274;&#xC2A4;</button>
</div>
<div class="grid-wrap">
  <div class="grid" id="grid"></div>
  <div class="state-msg" id="state-msg">로딩 중...</div>
</div>

<script>
const SUPABASE_URL      = 'https://tnqkwfcnoelbwkyiyyra.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRucWt3ZmNub2VsYndreWl5eXJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NDA1MDIsImV4cCI6MjA5ODAxNjUwMn0.qjXPMx9Bs8ozPrFYKQKuy5M0_vtXawfnnpeFQhqJSvA';

const PEOPLE = [
  { id: 'all',            name: '전체',        name_ko: '전체',        title: '',                   avatar: '★',  color: '#6366f1' },
  { id: 'sam_altman',     name: 'Sam Altman',  name_ko: '샘 올트먼',   title: 'CEO, OpenAI',        avatar: 'SA', color: '#10b981' },
  { id: 'jensen_huang',   name: 'Jensen Huang',name_ko: '젠슨 황',     title: 'CEO, NVIDIA',        avatar: 'JH', color: '#76b900' },
  { id: 'dario_amodei',   name: 'Dario Amodei',name_ko: '다리오 아모데이', title: 'CEO, Anthropic',  avatar: 'DA', color: '#d97706' },
  { id: 'elon_musk',      name: 'Elon Musk',   name_ko: '일론 머스크', title: 'CEO, xAI / Tesla',  avatar: 'EM', color: '#6366f1' },
  { id: 'geoffrey_hinton',name: 'G. Hinton',   name_ko: '제프리 힌튼', title: 'Godfather of AI',   avatar: 'GH', color: '#ec4899' },
  { id: 'demis_hassabis', name: 'D. Hassabis', name_ko: '데미스 하사비스', title: 'CEO, DeepMind',  avatar: 'DH', color: '#3b82f6' },
  { id: 'yann_lecun',     name: 'Yann LeCun',  name_ko: '얀 르쿤',    title: 'Chief AI Scientist, Meta', avatar: 'YL', color: '#f59e0b' },
  { id: 'andrew_ng',      name: 'Andrew Ng',   name_ko: '앤드류 응',  title: 'Founder, DeepLearning.AI', avatar: 'AN', color: '#14b8a6' },
  { id: 'satya_nadella',  name: 'S. Nadella',  name_ko: '사티아 나델라', title: 'CEO, Microsoft',  avatar: 'SN', color: '#0ea5e9' },
  { id: 'sundar_pichai',  name: 'S. Pichai',   name_ko: '순다르 피차이', title: 'CEO, Google',     avatar: 'SP', color: '#ea4335' },
  { id: 'mark_zuckerberg',name: 'M. Zuckerberg',name_ko: '마크 저커버그', title: 'CEO, Meta',      avatar: 'MZ', color: '#1877f2' },
];

let allItems = [];
let currentPerson = 'all';
let currentType = 'all';

function buildTabs() {
  const wrap = document.getElementById('person-tabs');
  wrap.innerHTML = PEOPLE.map(p => `
    <button class="person-tab ${p.id === 'all' ? 'active' : ''}"
      data-id="${p.id}" style="--tab-color:${p.color}"
      onclick="setPerson('${p.id}')">
      <div class="avatar" style="background:${p.color}22;color:${p.color}">${p.avatar}</div>
      <div class="tab-info">
        <span class="tab-name">${p.name_ko || p.name}</span>
        ${p.title ? `<span class="tab-title">${p.title}</span>` : ''}
      </div>
    </button>
  `).join('');
}

function setPerson(id) {
  currentPerson = id;
  document.querySelectorAll('.person-tab').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  render();
}

function setType(t) {
  currentType = t;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === t));
  render();
}

async function loadBriefings() {
  const list = document.getElementById('briefing-list');
  const today = new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
  document.getElementById('briefing-date').textContent = today;

  try {
    const todayIso = new Date().toISOString().slice(0, 10);
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/ai_briefings?select=*&date=eq.${todayIso}&order=rank.asc`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    const raw = await res.json();
    const briefings = Array.isArray(raw) ? raw : [];

    if (!briefings.length) {
      list.innerHTML = '<div style="color:#bbb;font-size:13px;padding:12px 0">오늘의 브리핑이 아직 없습니다. 매일 오전 9시에 업데이트됩니다.</div>';
      return;
    }

    list.innerHTML = briefings.map(item => {
      const p = PEOPLE.find(p => p.id === item.person_id);
      const color = p?.color || '#6366f1';
      const name = p?.name_ko || p?.name || '';
      const summaryHtml = item.summary_ko
        ? `<div class="briefing-summary">${item.summary_ko}</div>`
        : '';
      return `
        <a class="briefing-item" href="${item.url}" target="_blank" rel="noopener">
          <div class="briefing-avatar" style="background:${color}18;color:${color}">${p?.avatar || '?'}</div>
          <div class="briefing-content">
            ${name ? `<div class="briefing-person" style="color:${color}">${name}</div>` : ''}
            <div class="briefing-title">${item.title}</div>
            ${summaryHtml}
            <div class="briefing-source">${item.source || ''} · ${relativeTime(item.published_at)}</div>
          </div>
        </a>`;
    }).join('');
  } catch (e) {
    list.innerHTML = '<div style="color:#bbb;font-size:13px;padding:12px 0">브리핑을 불러오지 못했습니다.</div>';
    console.error(e);
  }
}

function relativeTime(iso) {
  if (!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const h = Math.floor(diff / 3600000);
  if (h < 1) return '방금';
  if (h < 24) return `${h}시간 전`;
  const d = Math.floor(h / 24);
  if (d < 30) return `${d}일 전`;
  return `${Math.floor(d / 30)}개월 전`;
}

function render() {
  const grid = document.getElementById('grid');
  const msg  = document.getElementById('state-msg');
  let items = allItems;
  if (currentPerson !== 'all') items = items.filter(i => i.person_id === currentPerson);
  if (currentType   !== 'all') items = items.filter(i => i.type === currentType);

  if (!items.length) {
    grid.innerHTML = '';
    msg.style.display = 'block';
    msg.textContent = '항목이 없습니다.';
    return;
  }
  msg.style.display = 'none';

  grid.innerHTML = items.map(item => {
    const thumb = item.thumbnail
      ? `<img class="card-thumb" src="${item.thumbnail}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : `<div class="card-thumb-placeholder">${item.type === 'video' ? '▶' : '📰'}</div>`;
    return `
      <a class="card" href="${item.url}" target="_blank" rel="noopener">
        ${thumb}
        <div class="card-body">
          <div class="card-meta">
            <span class="card-type type-${item.type}">${item.type === 'video' ? '▶ 영상' : '📰 뉴스'}</span>
            <span class="card-source">${item.source || ''}</span>
            <span class="card-date">${relativeTime(item.published_at)}</span>
          </div>
          <div class="card-title">${item.title || ''}</div>
        </div>
      </a>`;
  }).join('');
}

async function loadData(force = false) {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/ai_news?select=*&order=published_at.desc`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    const raw = await res.json();
    const items = Array.isArray(raw) ? raw : [];
    allItems = items;
    const updatedAt = items[0]?.updated_at ?? null;
    if (updatedAt) {
      document.getElementById('updated-label').textContent = `업데이트: ${updatedAt.slice(0,16).replace('T',' ')}`;
    }
    render();
  } catch (e) {
    document.getElementById('state-msg').style.display = 'block';
    document.getElementById('state-msg').textContent = '데이터를 불러오지 못했습니다.';
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

buildTabs();
loadBriefings();
loadData();
</script>
</body>
</html>
