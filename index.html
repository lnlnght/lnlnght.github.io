<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF 투자 참고</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0f; color: #e2e2e8; min-height: 100vh; }

        header { max-width: 1200px; margin: 0 auto; padding: 36px 24px 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
        .header-left h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #fff 0%, #9090b0 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header-left p { font-size: 12px; color: #2e2e42; margin-top: 4px; }
        .header-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .update-label { font-size: 11px; color: #3a3a4a; }
        .refresh-btn { padding: 5px 14px; border-radius: 8px; border: 1px solid #222; background: transparent; color: #555; font-size: 12px; cursor: pointer; transition: all 0.15s; }
        .refresh-btn:hover { color: #aaa; border-color: #333; }
        .refresh-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .profile-link { padding: 5px 14px; border-radius: 8px; border: 1px solid #222; color: #555; font-size: 12px; text-decoration: none; transition: all 0.15s; }
        .profile-link:hover { color: #aaa; border-color: #333; }

        .filter-area { max-width: 1200px; margin: 0 auto; padding: 12px 24px 24px; display: flex; flex-direction: column; gap: 8px; }
        .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .filter-label { font-size: 10px; color: #2e2e42; min-width: 28px; }
        .filter-btn { padding: 5px 14px; border-radius: 20px; border: 1px solid #1e1e2a; background: transparent; color: #555; font-size: 12px; cursor: pointer; transition: all 0.15s; }
        .filter-btn:hover { color: #999; border-color: #2a2a3a; }
        .filter-btn.active { background: #14141e; color: #e2e2e8; border-color: #6366f1; }
        .market-btn { padding: 4px 12px; border-radius: 20px; border: 1px solid #1e1e2a; background: transparent; color: #555; font-size: 12px; cursor: pointer; transition: all 0.15s; }
        .market-btn:hover { color: #999; border-color: #2a2a3a; }
        .market-btn.active-all { background: #14141e; color: #e2e2e8; border-color: #6366f1; }
        .market-btn.active-us  { background: #0f1f0f; color: #22c55e; border-color: #22c55e; }
        .market-btn.active-kr  { background: #161630; color: #6366f1; border-color: #6366f1; }

        .chart-panel { max-width: 1200px; margin: 0 auto 28px; padding: 0 24px; display: none; }
        .chart-panel.visible { display: block; }
        .chart-box { background: #0e0e16; border: 1px solid #1a1a28; border-radius: 14px; padding: 24px; }
        .chart-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 32px; }
        .chart-left { flex: 1; min-width: 0; }
        .c-ticker { font-size: 12px; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
        .c-name { font-size: 15px; color: #666; margin-bottom: 10px; }
        .c-price { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
        .c-change { font-size: 14px; margin-top: 4px; }
        .chart-meta { display: grid; grid-template-columns: repeat(3, auto); gap: 6px 28px; text-align: right; flex-shrink: 0; }
        .meta-item .mlabel { font-size: 10px; color: #2e2e42; margin-bottom: 3px; }
        .meta-item .mvalue { font-size: 13px; color: #aaa; font-weight: 600; }
        .range-btns { display: flex; gap: 6px; margin-bottom: 16px; }
        .range-btn { padding: 4px 12px; border-radius: 6px; border: 1px solid #1e1e2a; background: transparent; color: #444; font-size: 12px; cursor: pointer; transition: all 0.15s; }
        .range-btn.active { background: #6366f1; border-color: #6366f1; color: #fff; }
        .chart-wrap { height: 240px; position: relative; }

        .etf-grid { max-width: 1200px; margin: 0 auto; padding: 0 24px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(218px, 1fr)); gap: 10px; }
        .etf-card { background: #0e0e16; border: 1px solid #16161f; border-radius: 12px; padding: 18px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
        .etf-card:hover { background: #121218; border-color: #252535; }
        .etf-card.selected { border-color: #6366f1; background: #111120; }

        .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .card-ticker { font-size: 15px; font-weight: 700; }
        .card-badges { display: flex; gap: 4px; }
        .market-badge { font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: 700; }
        .badge-us { background: #0f1f0f; color: #22c55e; }
        .badge-kr { background: #161630; color: #6366f1; }
        .cat-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
        .cat-지수   { background: #16162a; color: #818cf8; }
        .cat-배당   { background: #0f1f14; color: #4ade80; }
        .cat-채권   { background: #1c1a10; color: #fbbf24; }
        .cat-섹터   { background: #170f22; color: #c084fc; }
        .cat-테마   { background: #1c0f18; color: #f472b6; }
        .cat-원자재 { background: #191910; color: #facc15; }
        .cat-레버리지 { background: #1f1010; color: #f87171; }

        .card-name { font-size: 12px; color: #3a3a4a; margin-bottom: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-price { font-size: 21px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 3px; }
        .card-change { font-size: 13px; margin-bottom: 14px; }
        .card-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .mtr-label { font-size: 10px; color: #2a2a3a; margin-bottom: 2px; }
        .mtr-value { font-size: 12px; color: #666; font-weight: 600; }
        .card-range-bar { height: 3px; background: #1a1a26; border-radius: 2px; margin-bottom: 6px; position: relative; }
        .card-range-fill { height: 100%; border-radius: 2px; position: absolute; top: 0; left: 0; }
        .card-range-labels { display: flex; justify-content: space-between; font-size: 10px; color: #2a2a3a; }

        .up { color: #22c55e; } .down { color: #ef4444; } .neutral { color: #555; }
        .state-msg { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: #333; font-size: 14px; line-height: 2; }
        footer { text-align: center; padding: 32px; font-size: 11px; color: #1e1e28; border-top: 1px solid #0e0e16; }
    </style>
</head>
<body>
<header>
    <div class="header-left">
        <h1>ETF 투자 참고</h1>
        <p>미국·한국 주요 ETF · 장 중 15분 간격 업데이트</p>
    </div>
    <div class="header-right">
        <a href="/stocks.html" class="profile-link">종목</a>
        <a href="https://lnlnght.github.io/my-profile-site/" class="profile-link">자기소개</a>
        <span class="update-label" id="update-label">로딩 중…</span>
        <button class="refresh-btn" id="refresh-btn" onclick="loadData()">↻ 새로고침</button>
    </div>
</header>

<div class="filter-area">
    <div class="filter-row">
        <span class="filter-label">시장</span>
        <button class="market-btn active-all" onclick="applyMarket('전체',this)">전체</button>
        <button class="market-btn" onclick="applyMarket('US',this)">미국</button>
        <button class="market-btn" onclick="applyMarket('KR',this)">한국</button>
    </div>
    <div class="filter-row">
        <span class="filter-label">분류</span>
        <button class="filter-btn active" onclick="applyFilter('전체',this)">전체</button>
        <button class="filter-btn" onclick="applyFilter('지수',this)">지수</button>
        <button class="filter-btn" onclick="applyFilter('배당',this)">배당</button>
        <button class="filter-btn" onclick="applyFilter('채권',this)">채권</button>
        <button class="filter-btn" onclick="applyFilter('섹터',this)">섹터</button>
        <button class="filter-btn" onclick="applyFilter('테마',this)">테마</button>
        <button class="filter-btn" onclick="applyFilter('원자재',this)">원자재</button>
        <button class="filter-btn" onclick="applyFilter('레버리지',this)">레버리지</button>
    </div>
</div>

<div class="chart-panel" id="chart-panel">
    <div class="chart-box">
        <div class="chart-header">
            <div class="chart-left">
                <div class="c-ticker" id="c-ticker">—</div>
                <div class="c-name"   id="c-name">—</div>
                <div class="c-price"  id="c-price">—</div>
                <div class="c-change" id="c-change">—</div>
            </div>
            <div class="chart-meta" id="c-meta"></div>
        </div>
        <div class="range-btns">
            <button class="range-btn" onclick="setRange(21,this)">1개월</button>
            <button class="range-btn active" onclick="setRange(63,this)">3개월</button>
            <button class="range-btn" onclick="setRange(126,this)">6개월</button>
            <button class="range-btn" onclick="setRange(252,this)">1년</button>
        </div>
        <div class="chart-wrap"><canvas id="price-chart"></canvas></div>
    </div>
</div>

<div class="etf-grid" id="etf-grid">
    <div class="state-msg">📊 데이터 불러오는 중…</div>
</div>

<footer>ETF 투자 참고 · 미국·한국 장 중 15분 간격 자동 업데이트 · 투자 판단의 최종 책임은 본인에게 있습니다</footer>

<script>
let allEtfs=[], selected=null, currentRange=63, chartInst=null;
let activeMarket='전체', activeFilter='전체';
let timerInterval=null, autoRefreshTimer=null;

const fmtUSD = v => '$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtKRW = v => '₩'+Math.round(v).toLocaleString('ko-KR');
const fmt    = (v, cur) => cur==='KRW' ? fmtKRW(v) : fmtUSD(v);
const fmtPct = v => v ? (v*100).toFixed(2)+'%' : '—';
const fmtAum = (v, cur) => {
    if (!v) return '—';
    if (cur==='KRW') {
        if (v>=1e12) return (v/1e12).toFixed(1)+'조₩';
        if (v>=1e8)  return (v/1e8).toFixed(0)+'억₩';
        return (v/1e6).toFixed(0)+'백만₩';
    }
    if (v>=1e12) return '$'+(v/1e12).toFixed(1)+'T';
    if (v>=1e9)  return '$'+(v/1e9).toFixed(1)+'B';
    return '$'+(v/1e6).toFixed(0)+'M';
};
const chgCls = c => c===0?'neutral':c>0?'up':'down';

function startAgeTimer(dateStr) {
    if (timerInterval) clearInterval(timerInterval);
    const base = new Date(dateStr);
    const tick = () => {
        const m = Math.floor((Date.now()-base.getTime())/60000);
        document.getElementById('update-label').textContent = m<1?'방금 업데이트':`${m}분 전 업데이트`;
    };
    tick();
    timerInterval = setInterval(tick, 60000);
}

async function loadData() {
    const btn = document.getElementById('refresh-btn');
    btn.disabled = true;
    if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
    try {
        const res = await fetch('etfs.json?t='+Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allEtfs = data.etfs || [];
        startAgeTimer(data.updated);
        renderCards(filtered());
    } catch(e) {
        document.getElementById('update-label').textContent = '데이터 없음';
        document.getElementById('etf-grid').innerHTML =
            '<div class="state-msg">⚠️ 데이터를 불러올 수 없습니다<br><small style="color:#555">'+e.message+'</small></div>';
        btn.disabled = false;
        autoRefreshTimer = setTimeout(loadData, 5*60*1000);
        return;
    }
    if (allEtfs.length && !selected) {
        try { selectEtf(allEtfs[0].code); } catch(e) { /* 차트 오류 무시 */ }
    } else if (selected) {
        selected = allEtfs.find(e=>e.code===selected.code)||null;
        if (selected) {
            try { updatePanel(); drawChart(currentRange); } catch(e) { /* 차트 오류 무시 */ }
        }
    }
    btn.disabled = false;
    autoRefreshTimer = setTimeout(loadData, 5*60*1000);
}

const filtered = () => allEtfs
    .filter(e => activeMarket==='전체' || e.market===activeMarket)
    .filter(e => activeFilter==='전체' || e.category===activeFilter);

function renderCards(etfs) {
    const g = document.getElementById('etf-grid');
    if (!etfs.length) { g.innerHTML='<div class="state-msg">표시할 ETF가 없습니다</div>'; return; }
    g.innerHTML = etfs.map(e => {
        const sign=e.change>=0?'+':'', c=chgCls(e.change);
        const chgAbs = e.currency==='KRW'
            ? '₩'+Math.abs(Math.round(e.change)).toLocaleString('ko-KR')
            : '$'+Math.abs(e.change).toFixed(2);
        const range=e.high_52w-e.low_52w, pos=range>0?Math.min(100,Math.max(0,((e.current-e.low_52w)/range)*100)):50;
        const bar=e.change>=0?'#22c55e':'#ef4444';
        const isSel=selected&&selected.code===e.code;
        const fromLow=range>0?(((e.current-e.low_52w)/e.low_52w)*100).toFixed(1):'—';
        return `<div class="etf-card${isSel?' selected':''}" onclick="selectEtf('${e.code}')">
<div class="card-top">
  <span class="card-ticker">${e.code}</span>
  <div class="card-badges">
    <span class="market-badge badge-${e.market.toLowerCase()}">${e.market}</span>
    <span class="cat-badge cat-${e.category}">${e.category}</span>
  </div>
</div>
<div class="card-name">${e.name}</div>
<div class="card-price">${fmt(e.current,e.currency)}</div>
<div class="card-change ${c}">${sign}${chgAbs} (${sign}${e.change_pct.toFixed(2)}%)</div>
<div class="card-metrics">
  <div><div class="mtr-label">운용보수</div><div class="mtr-value">${fmtPct(e.expense_ratio)}</div></div>
  <div><div class="mtr-label">배당수익률</div><div class="mtr-value">${fmtPct(e.dividend_yield)}</div></div>
  <div><div class="mtr-label">AUM</div><div class="mtr-value">${fmtAum(e.total_assets,e.currency)}</div></div>
  <div><div class="mtr-label">저점 대비</div><div class="mtr-value">${fromLow!=='—'?'+'+fromLow+'%':'—'}</div></div>
</div>
<div class="card-range-bar"><div class="card-range-fill" style="width:${pos}%;background:${bar}"></div></div>
<div class="card-range-labels"><span>${fmt(e.low_52w,e.currency)}</span><span>${fmt(e.high_52w,e.currency)}</span></div>
</div>`;
    }).join('');
}

function updatePanel() {
    if (!selected) return;
    const el = document.getElementById('c-ticker');
    el.textContent = selected.code;
    el.style.color = selected.market==='KR' ? '#818cf8' : '#22c55e';
    document.getElementById('c-name').textContent  = selected.name;
    document.getElementById('c-price').textContent = fmt(selected.current, selected.currency);
    const sign=selected.change>=0?'+':'';
    const chgAbs = selected.currency==='KRW'
        ? '₩'+Math.abs(Math.round(selected.change)).toLocaleString('ko-KR')
        : '$'+Math.abs(selected.change).toFixed(2);
    const el2=document.getElementById('c-change');
    el2.textContent=`${sign}${chgAbs} (${sign}${selected.change_pct.toFixed(2)}%)`;
    el2.className='c-change '+chgCls(selected.change);
    const r=selected.high_52w-selected.low_52w;
    const pos=r>0?(((selected.current-selected.low_52w)/r)*100).toFixed(0)+'%':'—';
    document.getElementById('c-meta').innerHTML=[
        ['운용보수',   fmtPct(selected.expense_ratio)],
        ['배당수익률', fmtPct(selected.dividend_yield)],
        ['AUM',        fmtAum(selected.total_assets, selected.currency)],
        ['52주 고점',  fmt(selected.high_52w, selected.currency)],
        ['52주 저점',  fmt(selected.low_52w, selected.currency)],
        ['52주 위치',  pos],
    ].map(([l,v])=>`<div class="meta-item"><div class="mlabel">${l}</div><div class="mvalue">${v}</div></div>`).join('');
}

function selectEtf(code) {
    selected = allEtfs.find(e=>e.code===code);
    if (!selected) return;
    document.getElementById('chart-panel').classList.add('visible');
    updatePanel();
    drawChart(currentRange);
    renderCards(filtered());
    document.getElementById('chart-panel').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function drawChart(days) {
    if (!selected) return;
    const dates=selected.dates.slice(-days), closes=selected.closes.slice(-days);
    const labels=dates.map(d=>d.slice(5)), data=closes;
    const isUp=data.length>1&&data[data.length-1]>=data[0];
    const color=isUp?'#22c55e':'#ef4444';
    if (chartInst) chartInst.destroy();
    chartInst=new Chart(document.getElementById('price-chart'),{
        type:'line',
        data:{labels,datasets:[{data,borderColor:color,backgroundColor:color+'18',borderWidth:2,pointRadius:0,pointHoverRadius:4,fill:true,tension:0.3}]},
        options:{responsive:true,maintainAspectRatio:false,
            plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false,callbacks:{label:ctx=>fmt(ctx.parsed.y,selected.currency)}}},
            scales:{
                x:{grid:{color:'#0f0f18'},ticks:{color:'#2e2e42',maxTicksLimit:8,font:{size:11}}},
                y:{position:'right',grid:{color:'#141420'},ticks:{color:'#3a3a4a',font:{size:11},
                    callback: v => selected.currency==='KRW' ? '₩'+(v/1000).toFixed(0)+'k' : '$'+v.toFixed(0)
                }}
            }
        }
    });
}

function setRange(days,btn) {
    currentRange=days;
    document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    drawChart(days);
}

function applyMarket(mkt, btn) {
    activeMarket = mkt;
    document.querySelectorAll('.market-btn').forEach(b => b.className='market-btn');
    btn.classList.add(mkt==='전체'?'active-all':mkt==='US'?'active-us':'active-kr');
    renderCards(filtered());
}

function applyFilter(cat,btn) {
    activeFilter=cat;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(filtered());
}

loadData();
</script>
</body>
</html>
