<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전종목 실시간 주가 조회</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .search-area { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
        button { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        #chart_div { width: 100%; height: 500px; border: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔍 전종목 실시간 주가 조회</h2>
    <div class="search-area">
        <input type="text" id="stockInput" placeholder="종목명을 입력하세요 (예: 삼성전자)" list="stockList">
        <datalist id="stockList"></datalist> <button onclick="searchStock()">조회</button>
    </div>
    <div id="chart_div">종목명을 입력하고 조회를 눌러주세요.</div>
</div>

<script>
    let symbolMap = {};
    google.charts.load('current', {'packages':['corechart']});

    // 1. 페이지 로드 시 종목 리스트(symbols.json) 불러오기
    async function loadSymbols() {
        const response = await fetch('./symbols.json');
        symbolMap = await response.json();
        
        const datalist = document.getElementById('stockList');
        Object.keys(symbolMap).forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            datalist.appendChild(option);
        });
    }

    // 2. 실시간 API 호출
    async function searchStock() {
        const name = document.getElementById('stockInput').value;
        const code = symbolMap[name];
        
        if (!code) { alert("정확한 종목명을 선택해주세요."); return; }

        document.getElementById('chart_div').innerHTML = "데이터를 불러오는 중...";

        // 방법 A에서 썼던 공공데이터 API 호출
        const serviceKey = '97cb036aab4ad7e829130f4fe800973aa2ad98c14dc04214bedc223af2532ffd'; 
        const url = `https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService/getStockPriceInfo?serviceKey=${serviceKey}&numOfRows=20&resultType=json&itmsNm=${encodeURIComponent(name)}`;

        try {
        const res = await fetch(url);
        const json = await res.json();
        const items = json.response.body.items.item;

        if (!items || items.length === 0) {
            alert("데이터가 없습니다.");
            return;
        }

        // 핵심 수정 부분: 데이터 테이블 형식을 명시적으로 선언
        const data = new google.visualization.DataTable();
        data.addColumn('string', '날짜'); // X축
        data.addColumn('number', '종가'); // Y축

        // 데이터 역순 정렬 및 추가
        const rows = [];
        items.reverse().forEach(item => {
            // 날짜를 '2026-05-06' 형태로 변환
            const dateStr = item.basDt.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
            rows.push([dateStr, parseInt(item.clpr)]);
        });
        
        data.addRows(rows);

        drawChart(data, name); // 배열 대신 DataTable 객체를 넘김
    } catch (e) {
        console.error(e);
        alert("데이터 처리 중 오류가 발생했습니다.");
    }
    }

    function drawChart(chartData, title) {
        const data = google.visualization.arrayToDataTable(chartData);
        const chart = new google.visualization.LineChart(document.getElementById('chart_div'));
        chart.draw(data, { title: `${title} 추이`, height: 500, legend: 'none' });
    }

    loadSymbols();
</script>
</body>
</html>
