<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 실시간 통합 조회 시스템</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f0f4f8; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #e1e8ed; padding-bottom: 20px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        input { flex: 1; max-width: 400px; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #007bff; }
        button { padding: 12px 25px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #0056b3; }
        #chart_div { width: 100%; height: 500px; margin-top: 20px; border: 1px dashed #ccc; border-radius: 10px; display: flex; align-items: center; justify-content: center; background-color: #fafafa; }
        .status-bar { margin-top: 15px; font-size: 0.85rem; color: #666; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 전종목 통합 검색 시스템</h1>
        <p>종목명 또는 6자리 종목코드를 입력하세요.</p>
    </div>

    <div class="search-box">
        <input type="text" id="stockInput" placeholder="예: 삼성전자 또는 005930" list="stockList" onkeypress="if(event.keyCode==13) searchStock()">
        <datalist id="stockList"></datalist>
        <button onclick="searchStock()">조회하기</button>
    </div>

    <div id="chart_div">종목 정보가 여기에 표시됩니다.</div>
    <div class="status-bar" id="statusBar">시스템 준비 완료</div>
</div>

<script>
    let symbolMap = {}; // { "삼성전자": "005930", ... }
    
    // 구글 차트 라이브러리 로드
    google.charts.load('current', {'packages':['corechart']});
    google.charts.setOnLoadCallback(initSystem);

    async function initSystem() {
        try {
            // 1. symbols.json 로드
            const response = await fetch('./symbols.json');
            if (!response.ok) throw new Error("symbols.json을 찾을 수 없습니다.");
            symbolMap = await response.json();
            
            // 2. 자동완성 리스트 생성
            const datalist = document.getElementById('stockList');
            Object.keys(symbolMap).forEach(name => {
                const option = document.createElement('option');
                option.value = name; // 종목명 표시
                datalist.appendChild(option);
            });
            
            document.getElementById('statusBar').innerText = "데이터 로드 완료: " + Object.keys(symbolMap).length + "개 종목";
        } catch (e) {
            console.error("초기화 에러:", e);
            document.getElementById('statusBar').innerText = "초기화 에러: symbols.json 확인 필요";
        }
    }

    async function searchStock() {
        const input = document.getElementById('stockInput').value.trim();
        if (!input) return;

        let code = "";
        let displayName = "";

        // 입력값 판별: 6자리 숫자라면 종목코드로 간주
        const isCode = /^\d{6}$/.test(input);

        if (isCode) {
            code = input;
            // 코드로 종목명 역추적
            displayName = Object.keys(symbolMap).find(key => symbolMap[key] === input) || "알 수 없는 종목";
        } else {
            code = symbolMap[input];
            displayName = input;
        }

        if (!code) {
            alert("검색 결과가 없습니다. 종목명 또는 코드를 확인해 주세요.");
            return;
        }

        document.getElementById('chart_div').innerHTML = `<p>${displayName}(${code}) 데이터를 불러오는 중...</p>`;

        // API 설정 (금융위 주식 시세 정보)
        const serviceKey = '97cb036aab4ad7e829130f4fe800973aa2ad98c14dc04214bedc223af2532ffd'; 
        const url = `https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService/getStockPriceInfo?serviceKey=${serviceKey}&numOfRows=30&resultType=json&likeSrtnCd=${code}`;

        try {
            const res = await fetch(url);
            const json = await res.json();
            const items = json.response.body.items.item;

            if (!items || items.length === 0) {
                document.getElementById('chart_div').innerHTML = "최근 데이터가 없습니다. (휴장일 여부 확인)";
                return;
            }

            // 구글 차트 데이터 테이블 생성
            const dataTable = new google.visualization.DataTable();
            dataTable.addColumn('string', '날짜');
            dataTable.addColumn('number', '종가');

            const rows = [];
            items.reverse().forEach(item => {
                const dateStr = item.basDt.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
                rows.push([dateStr, parseInt(item.clpr)]);
            });
            
            dataTable.addRows(rows);

            const options = {
                title: `${displayName} (${code}) 최근 종가 추이`,
                curveType: 'function',
                legend: { position: 'bottom' },
                chartArea: { width: '85%', height: '70%' },
                hAxis: { slantedText: true, slantedTextAngle: 45 },
                vAxis: { format: '#,###원' },
                colors: ['#007bff']
            };

            const chart = new google.visualization.LineChart(document.getElementById('chart_div'));
            chart.draw(dataTable, options);
            document.getElementById('statusBar').innerText = `${displayName} 조회 완료 (${new Date().toLocaleTimeString()})`;

        } catch (e) {
            console.error("API 에러:", e);
            document.getElementById('chart_div').innerHTML = "데이터를 가져오는 중 오류가 발생했습니다. 인증키를 확인하세요.";
        }
    }
</script>

</body>
</html>
