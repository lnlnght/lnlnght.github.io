name: ETF Data Update

on:
  schedule:
    - cron: '0 0 * * *'           # 매일 오전 09:00 KST (UTC 00:00)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas requests pykrx

      - name: Run update script
        run: python update_etfs.py

      - name: Run stocks update script
        run: python update_stocks.py
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add etfs.json stocks.json
          git commit -m "Auto update ETF and stock data" || echo "No changes to commit"
          git pull --rebase origin $(git branch --show-current) || true
          git push