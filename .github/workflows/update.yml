name: ETF Data Update

on:
  schedule:
    - cron: '*/15 0-6 * * 1-5'    # 한국 장 중 (KST 09:00-15:30 = UTC 00:00-06:30)
    - cron: '0 13 * * 1-5'        # 미국 장 시작 전 (UTC 13:00)
    - cron: '*/15 14-21 * * 1-5'  # 미국 장 중 (UTC 14:00-21:59 = EST 09:00-16:59)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas requests pykrx

      - name: Run update script
        run: python update_etfs.py

      - name: Run stocks update script
        run: python update_stocks.py
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add etfs.json stocks.json
          git commit -m "Auto update ETF and stock data" || echo "No changes to commit"
          git pull --rebase origin $(git branch --show-current) || true
          git push
