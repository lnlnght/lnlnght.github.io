name: Stock Data Update

on:
  schedule:
    - cron: '*/15 0-6 * * 1-5'    # 국내 장 중 (KST 09:00-15:30 = UTC 00:00-06:30)
    - cron: '*/15 13-21 * * 1-5'  # 미국 장 중 (KST 22:30-06:00 = UTC 13:30-21:00)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run update script
        run: python update_symbols.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add stocks.json
          git commit -m "Auto update stock data" || echo "No changes to commit"
          git push
